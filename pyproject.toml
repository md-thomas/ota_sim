[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ota_sim"
version = "0.1.0"
description = "Simulated over-the-air RF/IQ channel (path loss, fading, AWGN, latency) over a network, between two arbitrary peers"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["ota_sim"]
